steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vector-api:$COMMIT_SHA", "./backend"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vector-api:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vector-api:$COMMIT_SHA", "--region=${_REGION}", "--platform=managed", "--allow-unauthenticated", "--port=8080", "--min-instances=0", "--cpu-boost", "--update-env-vars=^@^APP_ENV=production@DEBUG=false@CORS_ORIGINS=${_CORS_ORIGINS}@FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/vector-api:$COMMIT_SHA"
substitutions:
  _REGION: asia-south1
  _REPOSITORY: vector-prod
  _SERVICE: vector-app
  _CORS_ORIGINS: https://first-project-d7ffe.web.app,https://first-project-d7ffe.firebaseapp.com,https://production.vector-power.com
  _FIREBASE_STORAGE_BUCKET: first-project-d7ffe.firebasestorage.app
