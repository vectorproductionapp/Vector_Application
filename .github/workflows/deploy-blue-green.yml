name: Blue-green deploy

# Release pipeline. Merging to main does NOT ship anything on its own - this
# workflow builds the new version, deploys it with --no-traffic, health-checks
# it, and then WAITS for a human to click Approve in the "production"
# environment before any traffic moves.
#
#   merge to main
#        |
#        +--> backend:  build -> deploy --no-traffic -> probe /health
#        +--> frontend: build -> deploy to the "rc" channel (never "live")
#                            |
#                     [manual approval gate]
#                            |
#        +--> backend:  traffic -> 100% green
#        +--> frontend: clone "rc" channel -> live
#
# If the health probe fails the promote job never runs and production keeps
# serving the previous revision exactly as it was.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'public/**'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
  # Run the whole thing on demand, whatever changed.
  workflow_dispatch:

permissions:
  contents: read
  # Required so GitHub can mint an OIDC token for Workload Identity Federation.
  id-token: write

# One release at a time. Never cancel a half-finished one.
concurrency:
  group: blue-green-production
  cancel-in-progress: false

env:
  GCP_PROJECT: vector-production-506505
  REGION: asia-south1
  SERVICE: vector-application
  AR_HOST: asia-south1-docker.pkg.dev
  AR_REPO: cloud-run-source-deploy
  # The runtime identity Cloud Run runs as. The deployer SA is only allowed to
  # *act as* this account, so the service keeps its existing permissions.
  RUNTIME_SA: firebase-adminsdk-fbsvc@vector-production-506505.iam.gserviceaccount.com
  # Single-site project: the Hosting site ID equals the project ID.
  FB_SITE: vector-production-506505

jobs:
  # ---------------------------------------------------------------------------
  # 0. Work out what actually changed, so a docs-only merge deploys nothing.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        name: Detect changed areas
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - deploying both."
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)"
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(src/|public/|firebase\.json|package\.json|package-lock\.json)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 1. BACKEND: build the image and stand it up with zero traffic.
  # ---------------------------------------------------------------------------
  backend-green:
    name: Backend - deploy Green (no traffic)
    needs: [detect]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.green.outputs.revision }}
      url: ${{ steps.green.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          project_id: ${{ env.GCP_PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.AR_HOST }}" --quiet

      - id: image
        name: Resolve image tag
        run: |
          IMAGE="${AR_HOST}/${GCP_PROJECT}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE"

      - name: Build and push
        run: |
          docker build -t "${{ steps.image.outputs.image }}" backend
          docker push "${{ steps.image.outputs.image }}"

      - id: blue
        name: Record the Blue (currently live) revision
        run: |
          REV="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "Blue stays on: $REV"

      - name: Deploy Green with --no-traffic, tagged
        # --no-traffic  : the existing revision keeps serving every request.
        # --tag green   : ESSENTIAL. A revision deployed with 0% traffic and no
        #                 tag is immediately retired by Cloud Run, loses its URL
        #                 and cannot be probed. The tag keeps it Active and
        #                 gives it a dedicated hostname we can health-check.
        # Only --image is passed, so env vars, secrets and the runtime service
        # account on the existing revision are all carried over untouched.
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${{ steps.image.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --no-traffic \
            --tag green \
            --quiet

      - id: green
        name: Resolve the Green revision and its tag URL
        # Cloud Run does NOT populate status.url on revisions, so the only
        # reliable place to read a revision's hostname is the tagged entry in
        # the service's traffic array.
        run: |
          REV="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.latestCreatedRevisionName)')"
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
                 | python3 -c "
          import json, sys
          for t in json.load(sys.stdin)['status'].get('traffic', []):
              if t.get('tag') == 'green':
                  print(t.get('url', ''))
                  break
          ")"
          if [ -z "$REV" ] || [ -z "$URL" ]; then
            echo "::error::Could not resolve the Green revision or its tag URL."
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "url=$URL"     >> "$GITHUB_OUTPUT"
          echo "Green: $REV"
          echo "Green URL: $URL"

      - name: Assert secrets survived the deploy
        # Guard rail: if a future change ever strips JWT_SECRET off the
        # revision, refuse to promote rather than ship an app that would fall
        # back to the hardcoded default and sign tokens with a public string.
        run: |
          REF="$(gcloud run revisions describe "${{ steps.green.outputs.revision }}" \
                  --region "$REGION" --format=json \
                | python3 -c "
          import json, sys
          envs = json.load(sys.stdin)['spec']['containers'][0].get('env', [])
          print(','.join(sorted(e['name'] for e in envs if 'valueFrom' in e)))
          ")"
          echo "Secret-backed vars on Green: ${REF:-<none>}"
          case ",$REF," in
            *,JWT_SECRET,*) echo "JWT_SECRET is secret-backed. OK." ;;
            *) echo "::error::JWT_SECRET is NOT secret-backed on the Green revision."; exit 1 ;;
          esac

      - name: Health-check Green (production untouched)
        run: |
          URL="${{ steps.green.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "::error::Green URL is empty - refusing to probe."
            exit 1
          fi
          echo "Probing $URL/health"
          for i in $(seq 1 36); do
            # curl writes 000 AND exits non-zero on a connection failure, so
            # don't append a fallback 'echo 000' or it concatenates to 000000.
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/health" 2>/dev/null)"
            [ -z "$CODE" ] && CODE=000
            echo "  attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "GREEN HEALTHY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Green failed /health. Production traffic was NOT moved."
          exit 1

  # ---------------------------------------------------------------------------
  # 2. FRONTEND: build and stage on the "rc" channel. Never touches live.
  # ---------------------------------------------------------------------------
  frontend-rc:
    name: Frontend - deploy to rc channel
    needs: [detect]
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      channel: rc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify API base URL is configured
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
        run: |
          if [ -z "$REACT_APP_API_BASE_URL" ]; then
            echo "::error::Repository variable REACT_APP_API_BASE_URL is not set."
            exit 1
          fi
          echo "Building with REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"

      - run: npm ci

      - run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}

      - name: Write Firebase credentials
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VECTOR_PRODUCTION_506505 }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_VECTOR_PRODUCTION_506505 is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Install firebase-tools
        run: npm install --global firebase-tools@15

      - name: Deploy to the rc channel (NOT live)
        run: |
          firebase hosting:channel:deploy rc \
            --project "$FB_SITE" \
            --expires 7d

  # ---------------------------------------------------------------------------
  # 3. PROMOTE - the only job that can move production. Gated on a human
  #    clicking Approve for the "production" environment.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote to production
    needs: [backend-green, frontend-rc]
    # Run whenever at least one side produced something and neither failed.
    if: >-
      !cancelled() &&
      needs.backend-green.result != 'failure' &&
      needs.frontend-rc.result != 'failure' &&
      (needs.backend-green.result == 'success' || needs.frontend-rc.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          project_id: ${{ env.GCP_PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Shift backend traffic to Green
        if: needs.backend-green.result == 'success'
        run: |
          REV="${{ needs.backend-green.outputs.revision }}"
          echo "Moving 100% of traffic to $REV"
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --to-revisions "$REV=100" \
            --quiet
          # Drop the temporary 'green' tag so the next release starts clean
          # and no stale revision hostname is left routable.
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --remove-tags green \
            --quiet || echo "No green tag to remove."

      - name: Confirm backend health after the switch
        if: needs.backend-green.result == 'success'
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/health" || echo 000)"
          echo "Live /health -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Live backend is unhealthy after promote. Run scripts/gcp/rollback.ps1."
            exit 1
          fi

      - name: Promote the rc channel to live
        if: needs.frontend-rc.result == 'success'
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VECTOR_PRODUCTION_506505 }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          npm install --global firebase-tools@15
          firebase hosting:clone "$FB_SITE:rc" "$FB_SITE:live" --project "$FB_SITE"

      - name: Release summary
        run: |
          {
            echo "## Production release complete"
            echo ""
            echo "| | Result |"
            echo "|---|---|"
            echo "| Backend | \`${{ needs.backend-green.outputs.revision || 'not deployed' }}\` now serving 100% |"
            echo "| Frontend | \`rc\` channel promoted to live |"
            echo ""
            echo "Roll back with \`scripts/gcp/rollback.ps1\` and \`scripts/firebase/rollback-live.ps1\`."
          } >> "$GITHUB_STEP_SUMMARY"
