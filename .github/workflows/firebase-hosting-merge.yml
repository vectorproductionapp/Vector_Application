name: Deploy to Firebase Hosting on merge

# AUTO-DEPLOY (the original flow): builds and pushes straight to Hosting `live`
# on every push to main. There is no approval gate and no preview channel, so a
# bad release ships immediately.
#
# To back out a bad release: Firebase console -> Hosting -> Release history.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build-time API URL. Without it the bundle falls back to relative paths,
      # Firebase Hosting rewrites them to index.html, and login fails with
      # "You need to enable JavaScript to run this app."
      - name: Verify API base URL is configured
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
        run: |
          if [ -z "$REACT_APP_API_BASE_URL" ]; then
            echo "::error::Repository variable REACT_APP_API_BASE_URL is not set."
            exit 1
          fi
          echo "Building with REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"
      - run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VECTOR_PRODUCTION_506505 }}'
          channelId: live
          projectId: vector-production-506505
          entryPoint: .
