name: Deploy to Firebase Hosting on merge

# PAUSED 2026-10-12 - releases are now manual blue/green.
#
# This job used to build and push straight to Hosting `live` on every push to
# main, with no preview and no way to back out except a rollback. It is replaced
# by the preview-channel flow in docs/gcp-firebase-blue-green.md:
#
#   scripts/firebase/deploy-preview.ps1              -> preview channel URL
#   scripts/firebase/promote-live.ps1  -ChannelId X  -> byte-exact to live
#   scripts/firebase/rollback-live.ps1 -VersionId V  -> back one version
#
# To re-enable auto-deploy, restore:
#   on:
#     push:
#       branches:
#         - main
on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build-time API URL. Without it the bundle falls back to relative paths,
      # Firebase Hosting rewrites them to index.html, and login fails with
      # "You need to enable JavaScript to run this app."
      - name: Verify API base URL is configured
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
        run: |
          if [ -z "$REACT_APP_API_BASE_URL" ]; then
            echo "::error::Repository variable REACT_APP_API_BASE_URL is not set."
            exit 1
          fi
          echo "Building with REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"
      - run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VECTOR_PRODUCTION_506505 }}'
          channelId: live
          projectId: vector-production-506505
          entryPoint: .
